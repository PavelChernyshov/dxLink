syntax = "proto3";

package dxlink.test;

option java_multiple_files = true;

// Test-only service exercising the two interaction models the WebSocket transport supports
// (unary + server-streaming), used to drive createService end-to-end in both wire formats.
message EchoRequest {
  string message = 1;
  int32 count = 2;
}

message EchoResponse {
  string message = 1;
  int64 sequence = 2;
}

service EchoService {
  // Unary (REQUEST_RESPONSE).
  rpc Echo(EchoRequest) returns (EchoResponse);

  // Server-streaming (REQUEST_STREAM).
  rpc Subscribe(EchoRequest) returns (stream EchoResponse);
}
